# ═══════════════════════════════════════════════════════════════════════════════
# ReelsCrafter Multi-Container Application Stack (Production / Dev)
# ═══════════════════════════════════════════════════════════════════════════════

name: reelscrafter-multi-container

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  worker_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_cache:

services:
  # ─── Data Tier: PostgreSQL 16 ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: viewmax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viewmax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viewmax_secret}
      POSTGRES_DB: ${POSTGRES_DB:-viewmax}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viewmax}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  # ─── Data Tier: Redis 7 (ARQ Queue & Pub/Sub) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: viewmax_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
      - worker_net

  # ─── Storage Tier: MinIO S3 Object Storage ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: viewmax_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend_net
      - worker_net

  # ─── Storage Tier: MinIO Bucket Initializer ─────────────────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: viewmax_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin_secret};
        mc mb --ignore-existing local/uploads;
        mc mb --ignore-existing local/generated-images;
        mc mb --ignore-existing local/generated-videos;
        mc mb --ignore-existing local/audio;
        mc mb --ignore-existing local/projects;
        mc mb --ignore-existing local/storyboards;
        mc mb --ignore-existing local/renders;
        mc mb --ignore-existing local/exports;
        mc anonymous set download local/generated-images;
        mc anonymous set download local/generated-videos;
        mc anonymous set download local/exports;
        exit 0;
      "
    networks:
      - backend_net

  # ─── Application Tier: FastAPI API Gateway ─────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: viewmax_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-viewmax}:${POSTGRES_PASSWORD:-viewmax_secret}@postgres:5432/${POSTGRES_DB:-viewmax}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin_secret}
      - S3_BUCKET_PREFIX=
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_change_in_prod}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - PIPER_TTS_URL=${PIPER_TTS_URL:-http://host.docker.internal:5000}
      - USE_NVENC=${USE_NVENC:-true}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
      - media_cache:/app/media_cache
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - frontend_net
      - backend_net

  # ─── Application Tier: Next.js 15 Web Studio ───────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: development
    container_name: viewmax_web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - frontend_net

  # ─── Worker Tier: Central ARQ Job Queue Processor ───────────────────────────
  arq_worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: viewmax_arq_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-viewmax}:${POSTGRES_PASSWORD:-viewmax_secret}@postgres:5432/${POSTGRES_DB:-viewmax}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin_secret}
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_change_in_prod}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - PIPER_TTS_URL=${PIPER_TTS_URL:-http://host.docker.internal:5000}
      - USE_NVENC=${USE_NVENC:-true}
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
      - media_cache:/app/media_cache
    command: python -m arq workers.job_queue.WorkerSettings
    networks:
      - backend_net
      - worker_net

  # ─── Worker Tier: Image Worker (FLUX / SDXL Inference) ──────────────────────
  image_worker:
    build:
      context: ../workers
      dockerfile: Dockerfile
    container_name: viewmax_image_worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../workers:/app
    command: python image-worker/main.py
    networks:
      - worker_net

  # ─── Worker Tier: Video Worker (LTX Video / Wan 2.1 / SVD) ─────────────────
  video_worker:
    build:
      context: ../workers
      dockerfile: Dockerfile
    container_name: viewmax_video_worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../workers:/app
    command: python video-worker/main.py
    networks:
      - worker_net

  # ─── Worker Tier: Voice Worker (Piper / Coqui / ElevenLabs TTS) ────────────
  voice_worker:
    build:
      context: ../workers
      dockerfile: Dockerfile
    container_name: viewmax_voice_worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - PIPER_TTS_URL=${PIPER_TTS_URL:-http://host.docker.internal:5000}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../workers:/app
    command: python voice-worker/main.py
    networks:
      - worker_net

  # ─── Worker Tier: Render Worker (FFmpeg Hardware Compositor) ───────────────
  render_worker:
    build:
      context: ../workers
      dockerfile: Dockerfile
    container_name: viewmax_render_worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - USE_NVENC=${USE_NVENC:-true}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../workers:/app
      - media_cache:/media_cache
    command: python render-worker/main.py
    networks:
      - worker_net

  # ─── Worker Tier: Storyboard Worker (Pre-vis Keyframe QA) ───────────────────
  storyboard_worker:
    build:
      context: ../workers
      dockerfile: Dockerfile
    container_name: viewmax_storyboard_worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../workers:/app
    command: python storyboard-worker/main.py
    networks:
      - worker_net

  # ─── Worker Tier: Captions Worker (Word-Level Subtitles) ────────────────────
  captions_worker:
    build:
      context: ../workers
      dockerfile: Dockerfile
    container_name: viewmax_captions_worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../workers:/app
    command: python captions-worker/main.py
    networks:
      - worker_net

