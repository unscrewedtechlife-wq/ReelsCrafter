version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: viewmax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viewmax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viewmax_secret}
      POSTGRES_DB: ${POSTGRES_DB:-viewmax}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viewmax}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: viewmax_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible storage) ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: viewmax_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── MinIO bucket init ────────────────────────────────────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: viewmax_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin_secret};
        mc mb --ignore-existing local/uploads;
        mc mb --ignore-existing local/generated-images;
        mc mb --ignore-existing local/generated-videos;
        mc mb --ignore-existing local/audio;
        mc mb --ignore-existing local/projects;
        mc mb --ignore-existing local/exports;
        mc anonymous set download local/generated-images;
        mc anonymous set download local/generated-videos;
        exit 0;
      "

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: viewmax_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-viewmax}:${POSTGRES_PASSWORD:-viewmax_secret}@postgres:5432/${POSTGRES_DB:-viewmax}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin_secret}
      - S3_BUCKET_PREFIX=
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_change_in_prod}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - PIPER_TTS_URL=${PIPER_TTS_URL:-http://host.docker.internal:5000}
      - USE_NVENC=${USE_NVENC:-true}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ─── ARQ Worker (background job processor) ────────────────────────────────
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: viewmax_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-viewmax}:${POSTGRES_PASSWORD:-viewmax_secret}@postgres:5432/${POSTGRES_DB:-viewmax}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin_secret}
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_change_in_prod}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - PIPER_TTS_URL=${PIPER_TTS_URL:-http://host.docker.internal:5000}
      - USE_NVENC=${USE_NVENC:-true}
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: python -m arq workers.job_queue.WorkerSettings

  # ─── Next.js Frontend ────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: viewmax_web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  minio_data:
